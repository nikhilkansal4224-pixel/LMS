<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Obsidian Slate background squircle -->
  <rect width="32" height="32" rx="8" fill="#161920" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5" />
  
  <!-- Glowing Sunset Amber geometric tilted diamond emblem -->
  <g transform="translate(16, 16) rotate(45)" filter="url(#amberGlow)">
    <rect x="-6" y="-6" width="12" height="12" rx="2.5" fill="url(#amberGrad)" />
    <!-- Center Obsidian dot -->
    <circle cx="0" cy="0" r="2" fill="#161920" />
  </g>
</svg>
